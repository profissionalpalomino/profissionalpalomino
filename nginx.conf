server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Segurança HTTP
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Compressão. O Traefik na frente também comprime, mas deixar aqui garante
    # que o site continue leve se um dia for servido por outro caminho.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # Arquivos em /assets já têm hash no nome (index-AbC123.js), então mudam de
    # nome a cada build e podem ficar em cache por um ano sem risco.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Imagens, fontes e ícones não têm hash: uma semana, com revalidação.
    location ~* \.(png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|eot|mp4|webm)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # O index.html nunca entra em cache, senão o navegador fica preso no build
    # antigo e nenhum deploy aparece para quem já visitou o site.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Service Worker e Manifest nunca devem ficar em cache longo
    location ~* (sw\.js|manifest\.json|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
