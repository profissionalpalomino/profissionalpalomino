<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
      <linearGradient id="palominoRed" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#E8341C"/>
        <stop offset="100%" stop-color="#C9280F"/>
      </linearGradient>
      <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFF089"/>
        <stop offset="40%" stop-color="#FDE047"/>
        <stop offset="100%" stop-color="#F59E0B"/>
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
      </filter>
    </defs>
    <rect width="512" height="512" rx="112" fill="url(#palominoRed)"/>
    <g filter="url(#shadow)">
      
  <g transform="translate(256, 256) scale(10.5)">
    <!-- Polígono Externo Branco -->
    <polygon points="0,-16 13.8,-7 13.8,9 0,17 -13.8,9 -13.8,-7" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linejoin="round"/>
    
    <!-- Polígono Interno Sólido em Ouro Brilhante -->
    <polygon points="0,-8 7.5,-3.8 7.5,4.8 0,9 -7.5,4.8 -7.5,-3.8" fill="url(#goldAccent)"/>
    
    <!-- Ponto Central / Núcleo de Precisão -->
    <circle cx="0" cy="0.5" r="2.2" fill="#FFFFFF"/>
  </g>

    </g>
  </svg>