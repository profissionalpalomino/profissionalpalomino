<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
      <linearGradient id="palominoRed" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#E8341C"/>
        <stop offset="100%" stop-color="#C9280F"/>
      </linearGradient>
      <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FDE047"/>
        <stop offset="100%" stop-color="#F59E0B"/>
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.32"/>
      </filter>
    </defs>
    <rect width="512" height="512" rx="112" fill="url(#palominoRed)"/>
    <g filter="url(#shadow)">
      
  <!-- Pentágono / Polígono Concêntrico Oficial Palomino Tech -->
  <g transform="translate(256, 256) scale(13.5)">
    <!-- Polígono Externo Branco -->
    <polygon points="0,-15 13,-6.5 13,8.5 0,16 -13,8.5 -13,-6.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round"/>
    
    <!-- Polígono Interno Sólido em Dourado -->
    <polygon points="0,-7.5 7,-3.5 7,4.5 0,8.5 -7,4.5 -7,-3.5" fill="url(#goldAccent)"/>
    
    <!-- Ponto Central / Núcleo de Precisão -->
    <circle cx="0" cy="0.5" r="1.8" fill="#FFFFFF"/>
  </g>
  
  <!-- Tipografia Oficial Institucional -->
  <text x="256" y="430" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="6" text-anchor="middle">PALOMINO TECH</text>

    </g>
  </svg>