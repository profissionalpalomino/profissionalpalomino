    <!-- Brilho Superior Curvo -->
    <path d="M160 110 C125 110 108 136 108 180 C108 200 114 220 122 236 C128 200 150 170 186 160 C216 152 236 158 256 168 C276 158 296 152 326 160 C362 170 384 200 390 236 C398 220 404 200 404 180 C404 136 387 110 352 110 C316 110 286 138 256 138 C226 138 196 110 160 110 Z" fill="url(#toothHighlight)" fill-opacity="0.35"/>
    <!-- Estrela / Brilho Dental -->
    <polygon points="340,160 348,180 368,188 348,196 340,216 332,196 312,188 332,180" fill="#FFFFFF"/>
    <circle cx="340" cy="188" r="4" fill="#38BDF8"/>
