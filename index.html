  <!-- Tema claro por padrão da Palomino Tech (DESIGN_SYSTEM.md) -->
  <script>
    (function() {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark') {
          localStorage.removeItem('theme');
        }
        document.documentElement.classList.remove('dark');
      } catch (e) {}
    })();
  </script>
